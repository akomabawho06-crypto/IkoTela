<!doctype html>
<html lang="fil"><head><meta charset="utf-8">

<meta name="description" content="Logbook ng negosyo: EOD, cashflow, materyales, utang at sched.">
<meta name="theme-color" content="#2b3a8f">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{--bg:#f2f3f8;--card:#fff;--ink:#1b2150;--mut:#6a7090;--line:#dfe2ee;--ac:#2b3a8f;--ac2:#e2574c;--ok:#1f9d74;--warn:#d98a1a;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1226;--card:#181c3a;--ink:#e8eafc;--mut:#9aa0c8;--line:#2a2f5a;--ac:#8fa2ff;--ac2:#ff7b70;--ok:#43c79c;--warn:#f0b04a;--on:#10142e}}
:root[data-theme="dark"]{--bg:#0f1226;--card:#181c3a;--ink:#e8eafc;--mut:#9aa0c8;--line:#2a2f5a;--ac:#8fa2ff;--ac2:#ff7b70;--ok:#43c79c;--warn:#f0b04a;--on:#10142e}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0}
header{padding:14px 16px 0;max-width:1000px;margin:auto}
header h1{font-size:26px;font-weight:800}header small{color:var(--mut)}
nav{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;max-width:1000px;margin:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:8px 14px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
main{max-width:1000px;margin:auto;padding:0 16px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.card h3{font-size:17px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
label{display:block;font-size:13px;color:var(--mut)}
input,select,textarea{width:100%;margin-top:3px;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:56px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.btn{background:var(--ac);color:var(--on);border:0;border-radius:10px;padding:11px 18px;font:600 15px Figtree,sans-serif;cursor:pointer}
.btn.alt{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font:800 22px 'Bricolage Grotesque',sans-serif}.kpi span{color:var(--mut);font-size:13px}
.pos{color:var(--ok)}.neg{color:var(--ac2)}
.bar{margin:8px 0}.bar div.t{display:flex;justify-content:space-between;font-size:13px}
.bar .tr{height:12px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:3px}
.bar .f{height:100%;border-radius:6px;background:var(--ac)}
.cols{display:flex;gap:8px;align-items:flex-end;height:160px;border-bottom:1px solid var(--line);padding-top:6px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
.pair{display:flex;gap:3px;align-items:flex-end;height:calc(100% - 18px);width:100%;justify-content:center}
.pair i{display:block;width:40%;max-width:26px;border-radius:4px 4px 0 0;min-height:2px}
.lg{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:6px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.col small{font-size:11px;color:var(--mut);height:18px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--mut);font-weight:600;font-size:12px}
td.r,th.r{text-align:right}.x{border:0;background:none;color:var(--ac2);cursor:pointer;font-size:16px}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:2px 9px;font-size:12px;margin:2px 4px 2px 0}
.sticky{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;justify-content:space-between;z-index:9}
.sticky div{font-size:13px;color:var(--mut)}.sticky b{font-size:16px;color:var(--ink)}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:20;max-width:90%}
.mrow{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:8px;margin-bottom:8px}
@media(max-width:600px){.mrow{grid-template-columns:1fr 1fr}.mrow>:first-child{grid-column:1/3}}
.hint{font-size:12px;color:var(--mut);margin:6px 0 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:120px}
.ovd{color:var(--ac2);font-weight:600}
.nt{margin-top:4px;font-size:12px;padding:6px}.task{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}.task input{width:auto;margin:0}.done{text-decoration:line-through;color:var(--mut)}small{color:var(--mut)}
nav{scrollbar-width:none}nav::-webkit-scrollbar{display:none}input,select,textarea{font-size:16px}
.ln{display:grid;grid-template-columns:1.3fr .8fr 2fr auto;gap:6px;margin-bottom:8px;align-items:center}.ln.lp5{grid-template-columns:1fr 1.4fr .7fr 1.6fr auto}.ln input,.ln select{margin:0}.chip{margin:2px 4px 2px 0}
@media(max-width:600px){h1{font-size:22px}main{padding:0 12px 140px}.card{padding:12px}.kpis{grid-template-columns:1fr 1fr}.kpi b{font-size:18px}th,td{padding:6px}.sticky{padding-left:12px;padding-right:12px}.sticky .btn{padding:10px 14px;white-space:nowrap}
.ln,.ln.lp5{grid-template-columns:1fr 1fr}.ln .lc{order:1}.ln .la{order:2}.ln .lp{order:3;grid-column:1/3}.ln .ld{order:4;grid-column:1/3}.ln .ls{order:4;grid-column:1/3}.ln .x{order:5;grid-column:1/3;justify-self:end}.row>*{min-width:100%}.mrow{grid-template-columns:1fr 1fr}}
.sr{grid-template-columns:110px 110px 1fr auto}@media(max-width:600px){.sr{grid-template-columns:1fr 1fr}.sr .st{grid-column:1/3}}@page{margin:12mm}@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}html:root:root{--bg:#fff;--card:#fff;--ink:#111;--mut:#555;--line:#ccc;--ac:#2b3a8f;--ac2:#c0392b;--ok:#1a8a63;--warn:#b86e00;--on:#fff}html,body{background:#fff!important;color:#111!important}nav,.sticky,header,.noprint,#toast{display:none!important}main{padding:0!important;max-width:none!important}#rep{border:0!important;padding:0!important;break-inside:auto}#rep h3{break-after:avoid}#rep .kpis,#rep .bar,#rep p{break-inside:avoid}}
.lo{grid-template-columns:1.1fr .8fr 1.5fr 1.3fr auto}@media(max-width:600px){.lo{grid-template-columns:1fr 1fr}.ln .ls{order:4;grid-column:1/3}}
.ln.lp5{grid-template-columns:1fr 1.3fr .7fr .8fr 1.4fr auto}@media(max-width:600px){.ln.lp5{grid-template-columns:1fr .8fr .8fr}.lp5 .lp,.lp5 .ld,.lp5 .x{grid-column:1/4}.ln .lu{order:2}.lp5 .la{order:2}.lp5 .lc{order:1}}
</style></head><body>
<header><h1>IkoTela Logbook</h1><small>Isang input sa gabi, lahat naka-record na.</small></header>
<nav id="nav"></nav><main id="v"></main><div id="toast"></div>
<script>
const NOP=['Bayad-utang','Gamit/Equipment','Mula sa pondo'],K='ikotela_v1',CI=['Benta','Capital','Utang natanggap','Iba pang kita'],
COF=['Materyales','Labor','Upa','Kuryente/Tubig','Transportasyon','Repair','Supplies','Sweldo/Partner','Iba pa'],
DIRECT=['Materyales','Labor'],FUNDS=['Giving/Tithe','Capital Recovery','Maintenance','Emergency','Tax','Sweldo/Profit'],
TABS=[['dash','📊 Dashboard'],['report','📈 Report'],['eod','📝 EOD'],['cash','💰 Cashflow'],['stock','📦 Materyales'],['gear','🧰 Gamit'],['debt','📕 Utang'],['bills','🗓️ Bills'],['funds','🙏 Funds'],['goals','🎯 Goals'],['people','📒 Contacts'],['notes','📝 Notes'],['log','📘 History'],['set','⚙️ Settings']];
let db,S={tab:'dash',m:null,q:''};
const $=i=>document.getElementById(i),n=v=>parseFloat(v)||0,uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),
P=v=>(v<0?'-':'')+'₱'+Math.abs(v).toLocaleString('en-PH',{maximumFractionDigits:2}),
esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
sum=(a,f=x=>x.amt)=>a.reduce((s,x)=>s+f(x),0),
today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
S.m=today().slice(0,7);
function load0(){let o=null;try{o=JSON.parse(localStorage.getItem(K))}catch(e){try{localStorage.setItem(K+'_corrupt',localStorage.getItem(K))}catch(_){}setTimeout(()=>toast('Sira ang naka-save na data. May nakatagong kopya (ikotela_v1_corrupt).',1),300)}
db=Object.assign({cash:[],prod:[],inv:[],debts:[],pays:[],contacts:[],funds:[],eods:[],bills:[],tasks:[],set:{pct:{'Giving/Tithe':10,'Capital Recovery':10,Maintenance:5,Emergency:5,Tax:0,'Sweldo/Profit':0},goal:0}},o||{})}
function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){toast('Hindi ma-save sa browser — mag-backup sa Settings',1)}}
function toast(t,bad){const e=$('toast');e.textContent=t;e.style.background=bad?'var(--warn)':'var(--ok)';e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
function go(t){if(S.tab=='eod')try{draftSave()}catch(_){}S.tab=t;render();scrollTo(0,0)}
function render(){$('nav').innerHTML=TABS.map(([k,l])=>`<button class="${S.tab==k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
$('v').innerHTML=({eod:eodV,dash:dashV,cash:cashV,stock:stockV,debt:debtV,bills:billsV,report:reportV,notes:noteV,goals:goalsV,gear:gearV,funds:fundsV,people:peopleV,log:logV,set:setV})[S.tab]();if(S.tab=='eod'){draftLoad();live()}}
const bar=(l,v,max,fmt=P,c='var(--ac)')=>`<div class="bar"><div class="t"><span>${esc(l)}</span><b>${fmt(v)}</b></div><div class="tr"><div class="f" style="width:${max>0?Math.min(100,Math.max(0,v/max*100)):0}%;background:${c}"></div></div></div>`;
const tbl=(h,rows,kind,rcols=[])=>rows.length?`<div class="tw"><table><tr>${h.map((x,i)=>`<th class="${rcols.includes(i)?'r':''}">${x}</th>`).join('')}${kind?'<th></th>':''}</tr>${rows.map(r=>`<tr>${r[0].map((x,i)=>`<td class="${rcols.includes(i)?'r':''}">${x}</td>`).join('')}${kind?`<td>${EDF[kind]?`<button class="x" title="I-edit" aria-label="I-edit" onclick="edit('${kind}','${r[1]}')">✎</button>`:''}<button class="x" title="Burahin" aria-label="Burahin" onclick="del('${kind}','${r[1]}')">✕</button></td>`:''}</tr>`).join('')}</table></div>`:'<p class="hint">Wala pang laman. Mag-input sa EOD para mag-start.</p>';
/* ---------- EOD ---------- */
const fld=(id,l,ph='0')=>`<label>${l}<input id="${id}" type="number" min="0" step="any" inputmode="decimal" placeholder="${ph}"></label>`;
const txt=(id,l,ph='')=>`<label>${l}<input id="${id}" placeholder="${ph}"></label>`;
function matRow(){const mats=[...new Set(db.inv.map(x=>x.m))];return `<div class="mrow"><label>Materyal / Tela<input class="m" list="ml" placeholder="hal. Cotton"></label><label>Unit<select class="u"><option>kg</option><option>sako</option><option>yd</option><option>m</option><option>roll</option><option>pcs</option></select></label>${'<label>Binili<input class="b" type="number" min="0" step="any" inputmode="decimal" placeholder="0"></label><label>Nagamit<input class="g" type="number" min="0" step="any" inputmode="decimal" placeholder="0"></label>'}<label>Waste<input class="w" type="number" min="0" step="any" inputmode="decimal" placeholder="0"></label></div>`}
function addMat(){$('mats').insertAdjacentHTML('beforeend',matRow())}
const V=id=>($(id)?.value||'').trim();
function submitEOD(){const d=V('d')||today(),e=uid();{const ng=proj().filter(r=>r.after<-0.004).map(r=>r.n+' ('+P(r.after)+')');if(ng.length&&!confirm('Magiging NEGATIVE ang: '+ng.join(', ')+'. Ituloy pa rin?'))return}{const q=db.debts.find(x=>x.id==V('py_d'));if(q&&n(V('py_amt'))>rem(q)+1e-9)return toast('Sobra ang bayad. Natitira lang '+P(rem(q)),1)}if(db.eods.some(x=>x.d==d)&&!confirm('May EOD na para sa '+d+'. Idagdag pa rin ito?'))return;let c=0;const ops={done:V('x_done'),prob:V('x_prob'),act:V('x_act'),tom:V('x_tom'),iss:V('x_iss'),sch:V('x_sch')},hasOps=Object.values(ops).some(Boolean);let tin=0,tout=0;
rd('i').forEach(x=>{db.cash.push({id:uid(),e,d,t:'in',cat:x.c,amt:x.a,note:x.d});tin+=x.a;c++});
rd('o').forEach(x=>{db.cash.push({id:uid(),e,d,t:'out',cat:x.c,amt:x.a,note:x.d,src:x.s||''});if(x.s)db.funds.push({id:uid(),e,d,fund:x.s,amt:-x.a,note:'Gastos: '+x.c+(x.d?' — '+x.d:'')});tout+=x.a;c++});
rd('p').forEach(x=>{const f=PT.find(t=>t[0]==x.c)[1];db.prod.push({id:uid(),e,d,p:x.p,u:x.u||'pcs',made:0,bad:0,sold:0,[f]:x.a,note:x.d});c++});
document.querySelectorAll('.mrow').forEach(r=>{const m=r.querySelector('.m').value.trim(),b=n(r.querySelector('.b').value),g=n(r.querySelector('.g').value),w=n(r.querySelector('.w').value);if(m&&(b||g||w)){pushInv(e,d,m,r.querySelector('.u').value,b,g,w);c++}});
if(V('db_who')&&n(V('db_amt'))>0){const k='D'+String(++db.seq).padStart(3,'0');db.debts.push({id:uid(),e,d,code:k,who:V('db_who'),amt:n(V('db_amt')),due:V('db_due'),dir:V('db_dir'),note:V('db_note')});c++}
if(V('py_d')&&n(V('py_amt'))>0){const a=n(V('py_amt'));db.pays.push({id:uid(),e,d,debt:V('py_d'),amt:a});const dd=db.debts.find(x=>x.id==V('py_d')),ow=dd&&dd.dir=='owed';db.cash.push({id:uid(),e,d,t:ow?'in':'out',cat:ow?'Koleksyon ng utang':'Bayad-utang',amt:a});ow?tin+=a:tout+=a;c++}
const sales=sum(rd('i').filter(x=>x.c=='Benta'),x=>x.a);if($('auto').checked)allocs(sales).forEach(a=>{db.funds.push({id:uid(),e,d,fund:a.f,amt:a.amt,note:'Auto set-aside'});c++});
if(V('fu_f')&&n(V('fu_amt'))>0){db.funds.push({id:uid(),e,d,fund:V('fu_f'),amt:-n(V('fu_amt')),note:'Ginamit'});if($('fu_c')&&$('fu_c').checked)db.cash.push({id:uid(),e,d,t:'out',cat:'Mula sa pondo',amt:n(V('fu_amt')),note:V('fu_f')});c++}
{const ct=getContact();if(ct){db.contacts.push({id:uid(),e,d,...ct});c++}}
if(V('b_name')&&n(V('b_amt'))>0){db.bills.push({id:uid(),e,name:V('b_name'),amt:n(V('b_amt')),due:V('b_due'),rec:V('b_rec'),note:V('b_note'),cat:V('b_cat')});c++}
rdSch().filter(()=>(V('sch_d')||addD(d,1))>=today()).forEach(x=>{db.sched.push({id:uid(),e,d:V('sch_d')||addD(d,1),t:x.t,t1:x.a,t2:x.b,src:'eod',from:d,done:false,chg:false,note:''});c++});ops.tom.split('\n').map(x=>x.trim()).filter(Boolean).forEach(t=>{db.tasks.push({id:uid(),e,d,t,done:false});c++});
{const g=getGear();if(g){pushGear(g,e,d);c++}}
if(n(V('tg_p'))||n(V('tg_s'))||V('tg_n'))c++;
if(!c&&!hasOps){toast('Walang laman — walang na-log.',1);return}
db.eods.push({id:e,d,...ops,n:c,tin,tout,tp:n(V('tg_p')),tu:V('tg_u')||'pcs',ts:n(V('tg_s')),tn:V('tg_n')});recalc();try{localStorage.removeItem(K+'_draft')}catch(_){}save();S.tab='dash';render();scrollTo(0,0);toast(`Na-save! ${c} record na na-distribute sa mga category.`)}

/* ---------- calculations ---------- */
const rem=d=>d.amt-sum(db.pays.filter(p=>p.debt==d.id)),inM=(x)=>x.d.slice(0,7)==S.m;
function calc(){const c=db.cash.filter(inM),sales=sum(c.filter(x=>x.cat=='Benta')),direct=sum(c.filter(x=>x.t=='out'&&DIRECT.includes(x.cat))),op=sum(c.filter(x=>x.t=='out'&&!DIRECT.includes(x.cat)&&!NOP.includes(x.cat))),pr=db.prod.filter(x=>inM(x)&&!x.open);
return{sales,direct,op,gross:sales-direct,net:sales-direct-op,made:sum(pr,x=>x.made),bad:sum(pr,x=>x.bad),c}}
function mSel(){const ms=[...new Set([today().slice(0,7),...db.cash.map(x=>x.d.slice(0,7)),...db.eods.map(x=>x.d.slice(0,7))])].sort().reverse();return `<select onchange="S.m=this.value;render()" style="width:auto">${ms.map(m=>`<option ${m==S.m?'selected':''}>${m}</option>`).join('')}</select>`}

/* ---------- views ---------- */
function dashBase(){const k=calc(),cashBal=n(db.set.open)+sum(db.cash.filter(x=>x.t=='in'))-sum(db.cash.filter(x=>x.t=='out')),debt=sum(db.debts.filter(d=>d.dir!='owed').map(rem),x=>x),
days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}),
dv=days.map(d=>{const c=db.cash.filter(x=>x.d==d);return{d,s:sum(c.filter(x=>x.cat=='Benta')),x:sum(c.filter(x=>x.t=='out'&&!NOP.includes(x.cat)))}}),mx=Math.max(1,...dv.flatMap(x=>[x.s,x.x])),
ex={};k.c.filter(x=>x.t=='out'&&!NOP.includes(x.cat)).forEach(x=>ex[x.cat]=(ex[x.cat]||0)+x.amt);const exA=Object.entries(ex).sort((a,b)=>b[1]-a[1]),exM=exA[0]?.[1]||1;
const fb=FL().map(f=>[f,sum(db.funds.filter(x=>x.fund==f))]),rec=sum(db.funds.filter(x=>x.fund==capN()&&x.amt>0)),goal=n(db.set.goal),
stock=stockMap();
const verdict=k.sales==0?'Wala pang benta ngayong buwan.':k.net>=0?`Kumita ng ${P(k.net)} ngayong buwan.`:`Lugi ng ${P(-k.net)} ngayong buwan — tingnan ang gastos sa ibaba.`;
return `<div class="row" style="margin-bottom:10px"><h2 style="flex:2">Dashboard</h2><label style="flex:1">Buwan ${mSel()}</label></div>

return L.map(x=>`<div style="border-top:1px solid var(--line);padding:10px 0"><div class="row" style="align-items:center"><b style="flex:3 1 160px">${hd(x)}</b>${tg(x)}</div><small>${x.d} ${x.tm||''}</small>${h[x.id]?'<p class="hint">(nakatago — pindutin ang Ipakita)</p>':`<p style="white-space:pre-wrap;margin:6px 0">${esc(x.t)}</p>`}${nAct(x,h)}</div>`).join('')}
/* savings goals */
function goalCalc(){const A=[],cap=capN();if(n(db.set.goal)>0)A.push({id:'cap',name:'Capital recovery',fund:cap,target:n(db.set.goal),mode:'added',builtin:true});db.goals.forEach(g=>A.push({...g,mode:'bal'}));
return A.map(g=>{const R=db.funds.filter(x=>x.fund==g.fund),add=sum(R.filter(x=>x.amt>0),x=>x.amt),use=-sum(R.filter(x=>x.amt<0),x=>x.amt),saved=g.mode=='added'?add:add-use,rem=Math.max(0,g.target-saved),mo={};R.filter(x=>x.amt>0).forEach(x=>{const k=x.d.slice(0,7);mo[k]=(mo[k]||0)+x.amt});const ks=Object.keys(mo).sort().slice(-3),avg=ks.length?sum(ks.map(k=>mo[k]),x=>x)/ks.length:0,dd=g.due?dTo(g.due):null;
return{...g,add,use,saved,rem,pct:g.target>0?Math.min(100,saved/g.target*100):0,thisM:mo[today().slice(0,7)]||0,avg,eta:rem>0&&avg>0?Math.ceil(rem/avg):null,need:g.due&&rem>0&&dd>0?rem/Math.max(1,dd/30):null,late:g.due&&rem>0&&dd<0}})}
const goalBar=g=>bar(`${g.name} — naipon ${P(g.saved)} ng ${P(g.target)}`,g.saved,g.target,()=>g.pct.toFixed(0)+'%',g.pct>=100?'var(--ok)':'var(--ac)');
function goalDash(){const G=goalCalc();return G.length?`<div class="card"><h3>🎯 Savings goals</h3>${G.map(g=>goalBar(g)+`<p class="hint" style="margin:0 0 6px">Natitira ${P(g.rem)}${g.due?' · '+dLbl(g.due):''}${g.late?' <span class="neg">(lampas na ang target date)</span>':''}</p>`).join('')}</div>`:''}
function goalCard(g){const k=(l,v,c='')=>`<div class="kpi"><span>${l}</span><b class="${c}">${v}</b></div>`;return `<div class="card"><div class="row" style="align-items:center"><h3 style="flex:3 1 180px">🎯 ${esc(g.name)} <small>🏦 ${esc(g.fund)}</small></h3>${g.builtin?'':`<button class="x" style="flex:0 0 auto" title="I-edit" onclick="editGoal('${g.id}')">✎</button><button class="x" style="flex:0 0 auto" onclick="del('goals','${g.id}')">✕</button>`}</div>${goalBar(g)}<div class="kpis">${k('Nadagdag',P(g.add),'pos')}${g.mode=='bal'&&g.use>0?k('Nagamit',P(g.use),'neg'):''}${k(g.pct>=100?'✔ Abot na!':'Natitira pa',P(g.rem))}${k('Ngayong buwan',P(g.thisM))}${g.avg>0?k('Avg bawat buwan',P(g.avg)):''}${g.eta?k('Tantiya matapos','~'+g.eta+' buwan'):''}${g.need?k('Kailangan bawat buwan',P(g.need)):''}</div>${g.due?`<p class="hint">Target date: ${g.due} · ${dLbl(g.due)}</p>`:''}${g.note?`<p class="hint">📝 ${esc(g.note)}</p>`:''}<div class="row"><button class="btn" style="flex:1 1 auto" onclick="gAct('${g.id}',1)">➕ Dagdag ipon</button><button class="btn alt" style="flex:1 1 auto" onclick="gAct('${g.id}',-1)">➖ Gamitin / bawasan</button></div>${g.builtin?'<p class="hint">Ito ay mula sa Settings → Capital na babawiin. Ang bilang ay ang mga idinagdag lang sa pondo.</p>':''}</div>`}
function goalsV(){const f=FL().filter(x=>x!='Petty cash');return `<h2 style="margin-bottom:10px">🎯 Savings Goals</h2><div class="card"><h3>Bagong goal</h3><div class="grid">${txt('go_n','Ano ang iniipon? (hal. Sasakyan)')}${fld('go_t','Target na halaga (₱)')}<label>Pondong gagamitin<select id="go_f"><option value="">➕ Bagong pondo (pangalan ng goal)</option>${f.map(x=>`<option>${esc(x)}</option>`).join('')}</select></label><label>Target date<input id="go_d" type="date"></label>${fld('go_i','Meron na (₱, opsyonal)')}${fld('go_p','Auto-ipon % ng benta (opsyonal)')}${txt('go_x','Note')}</div><br><button class="btn" onclick="addGoal()">I-save ang goal</button><p class="hint">Ang naiipon ay naka-hiwalay sa pondo, kaya nababawasan ang Free cash. Kapag bibilhin na, i-record sa EOD at piliin ang pondong ito sa "Saan kukunin ang pera".</p></div>${goalCalc().map(goalCard).join('')||'<p class="hint">Wala pang goal. Magdagdag sa itaas, o itakda ang "Capital na babawiin" sa Settings.</p>'}`}
function addGoal(){const name=V('go_n'),target=n(V('go_t'));if(!name||!(target>0))return toast('Ilagay ang pangalan at target.',1);const fund=V('go_f')||name;db.goals.push({id:uid(),name,target,fund,due:V('go_d'),note:V('go_x'),created:today()});if(n(V('go_i'))>0)db.funds.push({id:uid(),e:null,d:today(),fund,amt:n(V('go_i')),note:'Panimulang ipon'});const p=n(V('go_p'));if(p>0&&!db.set.alloc.some(a=>a.name==fund))db.set.alloc.push({name:fund,type:'pct',v:p});save();render();toast('Na-save ang goal.'+(p>0?' Idinagdag sa allocation: '+p+'%.':''))}
function gAct(id,sg){const g=goalCalc().find(x=>x.id==id),a=n(prompt((sg>0?'Magkano ang idaragdag sa ':'Magkano ang gagamitin/ibabawas sa ')+g.name+'?'));if(!(a>0))return;if(sg>0&&a>freeNow()+1e-9&&!confirm('Mas malaki ito sa Free cash ('+P(freeNow())+'). Ituloy pa rin?'))return;db.funds.push({id:uid(),e:null,d:today(),fund:g.fund,amt:sg*a,note:sg>0?'Dagdag ipon':'Ginamit / binawas'});save();render()}
function editGoal(id){const g=db.goals.find(x=>x.id==id),t=prompt('Bagong target na halaga:',g.target);if(t===null)return;if(n(t)>0)g.target=n(t);const d=prompt('Target date (YYYY-MM-DD) o blanko:',g.due||'');if(d!==null)g.due=OK.test(d.trim())?d.trim():'';save();render()}

const fh=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return String(h)};
function stampSet(){const T=db.set,F=T._f=T._f||{},h=db._h=db._h||{};Object.keys(T).forEach(k=>{if(k=='_u'||k=='_f'||k=='lastBackup')return;const x=fh(JSON.stringify(T[k])),hk='set.'+k;if(h[hk]===undefined)h[hk]=x;else if(h[hk]!==x){h[hk]=x;F[k]=Date.now()}})}
function mergeSet(R){const T=db.set,lf=T._f||{},rf=R._f||{},lu=T._u||0,ru=R._u||0,lb=T.lastBackup,F=T._f=T._f||{},h=db._h=db._h||{};new Set([...Object.keys(T),...Object.keys(R)]).forEach(k=>{if(k=='_u'||k=='_f'||k=='lastBackup'||!(k in R))return;const lt=lf[k]??lu,rt=rf[k]??ru;if(!(k in T)||rt>lt){T[k]=k=='sack'?Object.assign({},T[k],R[k]):R[k];F[k]=rt}else if(k=='sack')T[k]=Object.assign({},R[k],T[k]);h['set.'+k]=fh(JSON.stringify(T[k]))});T.lastBackup=lb;T._u=Math.max(lu,ru)}
const futureBlock=()=>{const t=today(),F=db.sched.filter(x=>x.d>t).sort((p,q)=>p.d.localeCompare(q.d)||byT(p,q));return [...new Set(F.map(x=>x.d))].slice(0,3).map(d=>{const L=F.filter(x=>x.d==d),dn=['Linggo','Lunes','Martes','Miyerkules','Huwebes','Biyernes','Sabado'][new Date(d+'T00:00').getDay()];return `<div style="border-top:1px solid var(--line);margin-top:10px;padding-top:8px"><b>📅 ${d==addD(t,1)?'Bukas':'Susunod'} — ${dn} ${d}</b> <small>${L.filter(x=>x.done).length}/${L.length} nasunod</small>${L.map(schRow).join('')}</div>`}).join('')};
load();render();lock();syncNow(0);
</script></body></html>
