<!doctype html>
<html lang="fil"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IkoTela Logbook</title>
<meta name="description" content="Logbook ng negosyo: EOD, cashflow, materyales, utang at sched.">
<meta name="theme-color" content="#2b3a8f">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IkoTela"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f3f8;--card:#fff;--ink:#1b2150;--mut:#6a7090;--line:#dfe2ee;--ac:#2b3a8f;--ac2:#e2574c;--ok:#1f9d74;--warn:#d98a1a;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1226;--card:#181c3a;--ink:#e8eafc;--mut:#9aa0c8;--line:#2a2f5a;--ac:#8fa2ff;--ac2:#ff7b70;--ok:#43c79c;--warn:#f0b04a;--on:#10142e}}
:root[data-theme="dark"]{--bg:#0f1226;--card:#181c3a;--ink:#e8eafc;--mut:#9aa0c8;--line:#2a2f5a;--ac:#8fa2ff;--ac2:#ff7b70;--ok:#43c79c;--warn:#f0b04a;--on:#10142e}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0}
header{padding:14px 16px 0;max-width:1000px;margin:auto}
header h1{font-size:26px;font-weight:800}header small{color:var(--mut)}
nav{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;max-width:1000px;margin:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:8px 14px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
main{max-width:1000px;margin:auto;padding:0 16px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.card h3{font-size:17px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
label{display:block;font-size:13px;color:var(--mut)}
input,select,textarea{width:100%;margin-top:3px;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:56px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.btn{background:var(--ac);color:var(--on);border:0;border-radius:10px;padding:11px 18px;font:600 15px Figtree,sans-serif;cursor:pointer}
.btn.alt{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font:800 22px 'Bricolage Grotesque',sans-serif}.kpi span{color:var(--mut);font-size:13px}
.pos{color:var(--ok)}.neg{color:var(--ac2)}
.bar{margin:8px 0}.bar div.t{display:flex;justify-content:space-between;font-size:13px}
.bar .tr{height:12px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:3px}
.bar .f{height:100%;border-radius:6px;background:var(--ac)}
.cols{display:flex;gap:8px;align-items:flex-end;height:160px;border-bottom:1px solid var(--line);padding-top:6px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
.pair{display:flex;gap:3px;align-items:flex-end;height:calc(100% - 18px);width:100%;justify-content:center}
.pair i{display:block;width:40%;max-width:26px;border-radius:4px 4px 0 0;min-height:2px}
.lg{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:6px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.col small{font-size:11px;color:var(--mut);height:18px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--mut);font-weight:600;font-size:12px}
td.r,th.r{text-align:right}.x{border:0;background:none;color:var(--ac2);cursor:pointer;font-size:16px}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:2px 9px;font-size:12px;margin:2px 4px 2px 0}
.sticky{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;justify-content:space-between;z-index:9}
.sticky div{font-size:13px;color:var(--mut)}.sticky b{font-size:16px;color:var(--ink)}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:20;max-width:90%}
.mrow{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:8px;margin-bottom:8px}
@media(max-width:600px){.mrow{grid-template-columns:1fr 1fr}.mrow>:first-child{grid-column:1/3}}
.hint{font-size:12px;color:var(--mut);margin:6px 0 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:120px}
.ovd{color:var(--ac2);font-weight:600}
.nt{margin-top:4px;font-size:12px;padding:6px}.task{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}.task input{width:auto;margin:0}.done{text-decoration:line-through;color:var(--mut)}small{color:var(--mut)}
nav{scrollbar-width:none}nav::-webkit-scrollbar{display:none}input,select,textarea{font-size:16px}
.ln{display:grid;grid-template-columns:1.3fr .8fr 2fr auto;gap:6px;margin-bottom:8px;align-items:center}.ln.lp5{grid-template-columns:1fr 1.4fr .7fr 1.6fr auto}.ln input,.ln select{margin:0}.chip{margin:2px 4px 2px 0}
@media(max-width:600px){h1{font-size:22px}main{padding:0 12px 140px}.card{padding:12px}.kpis{grid-template-columns:1fr 1fr}.kpi b{font-size:18px}th,td{padding:6px}.sticky{padding-left:12px;padding-right:12px}.sticky .btn{padding:10px 14px;white-space:nowrap}
.ln,.ln.lp5{grid-template-columns:1fr 1fr}.ln .lc{order:1}.ln .la{order:2}.ln .lp{order:3;grid-column:1/3}.ln .ld{order:4;grid-column:1/3}.ln .x{order:5;grid-column:1/3;justify-self:end}.row>*{min-width:100%}.mrow{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><h1>IkoTela Logbook</h1><small>Isang input sa gabi, lahat naka-record na.</small></header>
<nav id="nav"></nav><main id="v"></main><div id="toast"></div>
<script>
const NOP=['Bayad-utang','Gamit/Equipment','Mula sa pondo'],K='ikotela_v1',CI=['Benta','Capital','Utang natanggap','Iba pang kita'],
COF=['Materyales','Labor','Upa','Kuryente/Tubig','Transportasyon','Repair','Supplies','Sweldo/Partner','Iba pa'],
DIRECT=['Materyales','Labor'],FUNDS=['Giving/Tithe','Capital Recovery','Maintenance','Emergency','Tax','Sweldo/Profit'],
TABS=[['dash','📊 Dashboard'],['eod','📝 EOD'],['cash','💰 Cashflow'],['stock','📦 Materyales'],['gear','🧰 Gamit'],['debt','📕 Utang'],['bills','🗓️ Bills'],['funds','🙏 Funds'],['people','📒 Contacts'],['log','📘 History'],['set','⚙️ Settings']];
let db,S={tab:'dash',m:null,q:''};
const $=i=>document.getElementById(i),n=v=>parseFloat(v)||0,uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),
P=v=>(v<0?'-':'')+'₱'+Math.abs(v).toLocaleString('en-PH',{maximumFractionDigits:2}),
esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
sum=(a,f=x=>x.amt)=>a.reduce((s,x)=>s+f(x),0),
today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
S.m=today().slice(0,7);
function load0(){let o=null;try{o=JSON.parse(localStorage.getItem(K))}catch(e){try{localStorage.setItem(K+'_corrupt',localStorage.getItem(K))}catch(_){}setTimeout(()=>toast('Sira ang naka-save na data. May nakatagong kopya (ikotela_v1_corrupt).',1),300)}
db=Object.assign({cash:[],prod:[],inv:[],debts:[],pays:[],contacts:[],funds:[],eods:[],bills:[],tasks:[],set:{pct:{'Giving/Tithe':10,'Capital Recovery':10,Maintenance:5,Emergency:5,Tax:0,'Sweldo/Profit':0},goal:0}},o||{})}
function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){toast('Hindi ma-save sa browser — mag-backup sa Settings',1)}}
function toast(t,bad){const e=$('toast');e.textContent=t;e.style.background=bad?'var(--warn)':'var(--ok)';e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
function go(t){S.tab=t;render();scrollTo(0,0)}
function render(){$('nav').innerHTML=TABS.map(([k,l])=>`<button class="${S.tab==k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
$('v').innerHTML=({eod:eodV,dash:dashV,cash:cashV,stock:stockV,debt:debtV,bills:billsV,gear:gearV,funds:fundsV,people:peopleV,log:logV,set:setV})[S.tab]();if(S.tab=='eod'){draftLoad();live()}}
const bar=(l,v,max,fmt=P,c='var(--ac)')=>`<div class="bar"><div class="t"><span>${esc(l)}</span><b>${fmt(v)}</b></div><div class="tr"><div class="f" style="width:${max>0?Math.min(100,Math.max(0,v/max*100)):0}%;background:${c}"></div></div></div>`;
const tbl=(h,rows,kind,rcols=[])=>rows.length?`<div class="tw"><table><tr>${h.map((x,i)=>`<th class="${rcols.includes(i)?'r':''}">${x}</th>`).join('')}${kind?'<th></th>':''}</tr>${rows.map(r=>`<tr>${r[0].map((x,i)=>`<td class="${rcols.includes(i)?'r':''}">${x}</td>`).join('')}${kind?`<td>${EDF[kind]?`<button class="x" title="I-edit" aria-label="I-edit" onclick="edit('${kind}','${r[1]}')">✎</button>`:''}<button class="x" title="Burahin" aria-label="Burahin" onclick="del('${kind}','${r[1]}')">✕</button></td>`:''}</tr>`).join('')}</table></div>`:'<p class="hint">Wala pang laman. Mag-input sa EOD para mag-start.</p>';
/* ---------- EOD ---------- */
const fld=(id,l,ph='0')=>`<label>${l}<input id="${id}" type="number" min="0" step="any" inputmode="decimal" placeholder="${ph}"></label>`;
const txt=(id,l,ph='')=>`<label>${l}<input id="${id}" placeholder="${ph}"></label>`;
function matRow(){const mats=[...new Set(db.inv.map(x=>x.m))];return `<div class="mrow"><label>Materyal / Tela<input class="m" list="ml" placeholder="hal. Cotton"></label><label>Unit<select class="u"><option>kg</option><option>yd</option><option>m</option><option>roll</option><option>pcs</option></select></label>${'<label>Binili<input class="b" type="number" min="0" step="any" inputmode="decimal" placeholder="0"></label><label>Nagamit<input class="g" type="number" min="0" step="any" inputmode="decimal" placeholder="0"></label>'}<label>Waste<input class="w" type="number" min="0" step="any" inputmode="decimal" placeholder="0"></label></div>`}
function addMat(){$('mats').insertAdjacentHTML('beforeend',matRow())}
const V=id=>($(id)?.value||'').trim();
function submitEOD(){const d=V('d')||today(),e=uid();{const q=db.debts.find(x=>x.id==V('py_d'));if(q&&n(V('py_amt'))>rem(q)+1e-9)return toast('Sobra ang bayad. Natitira lang '+P(rem(q)),1)}if(db.eods.some(x=>x.d==d)&&!confirm('May EOD na para sa '+d+'. Idagdag pa rin ito?'))return;let c=0;const ops={done:V('x_done'),prob:V('x_prob'),act:V('x_act'),tom:V('x_tom'),iss:V('x_iss'),sch:V('x_sch')},hasOps=Object.values(ops).some(Boolean);let tin=0,tout=0;
rd('i').forEach(x=>{db.cash.push({id:uid(),e,d,t:'in',cat:x.c,amt:x.a,note:x.d});tin+=x.a;c++});
rd('o').forEach(x=>{db.cash.push({id:uid(),e,d,t:'out',cat:x.c,amt:x.a,note:x.d});tout+=x.a;c++});
rd('p').forEach(x=>{const f=PT.find(t=>t[0]==x.c)[1];db.prod.push({id:uid(),e,d,p:x.p,made:0,bad:0,sold:0,[f]:x.a,note:x.d});c++});
document.querySelectorAll('.mrow').forEach(r=>{const m=r.querySelector('.m').value.trim(),b=n(r.querySelector('.b').value),g=n(r.querySelector('.g').value),w=n(r.querySelector('.w').value);if(m&&(b||g||w)){db.inv.push({id:uid(),e,d,m,u:r.querySelector('.u').value,b,g,w});c++}});
if(V('db_who')&&n(V('db_amt'))>0){const k='D'+String(++db.seq).padStart(3,'0');db.debts.push({id:uid(),e,d,code:k,who:V('db_who'),amt:n(V('db_amt')),due:V('db_due'),dir:V('db_dir'),note:V('db_note')});c++}
if(V('py_d')&&n(V('py_amt'))>0){const a=n(V('py_amt'));db.pays.push({id:uid(),e,d,debt:V('py_d'),amt:a});const dd=db.debts.find(x=>x.id==V('py_d')),ow=dd&&dd.dir=='owed';db.cash.push({id:uid(),e,d,t:ow?'in':'out',cat:ow?'Koleksyon ng utang':'Bayad-utang',amt:a});ow?tin+=a:tout+=a;c++}
const sales=sum(rd('i').filter(x=>x.c=='Benta'),x=>x.a);if($('auto').checked)allocs(sales).forEach(a=>{db.funds.push({id:uid(),e,d,fund:a.f,amt:a.amt,note:'Auto set-aside'});c++});
if(V('fu_f')&&n(V('fu_amt'))>0){db.funds.push({id:uid(),e,d,fund:V('fu_f'),amt:-n(V('fu_amt')),note:'Ginamit'});if($('fu_c')&&$('fu_c').checked)db.cash.push({id:uid(),e,d,t:'out',cat:'Mula sa pondo',amt:n(V('fu_amt')),note:V('fu_f')});c++}
{const ct=getContact();if(ct){db.contacts.push({id:uid(),e,d,...ct});c++}}
if(V('b_name')&&n(V('b_amt'))>0){db.bills.push({id:uid(),e,name:V('b_name'),amt:n(V('b_amt')),due:V('b_due'),rec:V('b_rec'),note:V('b_note'),cat:V('b_cat')});c++}
V('x_sch').split('\n').map(x=>x.trim()).filter(Boolean).forEach(t=>{db.sched.push({id:uid(),e,d:addD(d,1),t,src:'eod',from:d,done:false,chg:false,note:''});c++});ops.tom.split('\n').map(x=>x.trim()).filter(Boolean).forEach(t=>{db.tasks.push({id:uid(),e,d,t,done:false});c++});
{const g=getGear();if(g){pushGear(g,e,d);c++}}
if(!c&&!hasOps){toast('Walang laman — walang na-log.',1);return}
db.eods.push({id:e,d,...ops,n:c,tin,tout});recalc();try{localStorage.removeItem(K+'_draft')}catch(_){}save();S.tab='dash';render();scrollTo(0,0);toast(`Na-save! ${c} record na na-distribute sa mga category.`)}

/* ---------- calculations ---------- */
const rem=d=>d.amt-sum(db.pays.filter(p=>p.debt==d.id)),inM=(x)=>x.d.slice(0,7)==S.m;
function calc(){const c=db.cash.filter(inM),sales=sum(c.filter(x=>x.cat=='Benta')),direct=sum(c.filter(x=>x.t=='out'&&DIRECT.includes(x.cat))),op=sum(c.filter(x=>x.t=='out'&&!DIRECT.includes(x.cat)&&!NOP.includes(x.cat))),pr=db.prod.filter(x=>inM(x)&&!x.open);
return{sales,direct,op,gross:sales-direct,net:sales-direct-op,made:sum(pr,x=>x.made),bad:sum(pr,x=>x.bad),c}}
function mSel(){const ms=[...new Set([today().slice(0,7),...db.cash.map(x=>x.d.slice(0,7)),...db.eods.map(x=>x.d.slice(0,7))])].sort().reverse();return `<select onchange="S.m=this.value;render()" style="width:auto">${ms.map(m=>`<option ${m==S.m?'selected':''}>${m}</option>`).join('')}</select>`}

/* ---------- views ---------- */
function dashBase(){const k=calc(),cashBal=n(db.set.open)+sum(db.cash.filter(x=>x.t=='in'))-sum(db.cash.filter(x=>x.t=='out')),debt=sum(db.debts.filter(d=>d.dir!='owed').map(rem),x=>x),
days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}),
dv=days.map(d=>{const c=db.cash.filter(x=>x.d==d);return{d,s:sum(c.filter(x=>x.cat=='Benta')),x:sum(c.filter(x=>x.t=='out'&&!NOP.includes(x.cat)))}}),mx=Math.max(1,...dv.flatMap(x=>[x.s,x.x])),
ex={};k.c.filter(x=>x.t=='out'&&!NOP.includes(x.cat)).forEach(x=>ex[x.cat]=(ex[x.cat]||0)+x.amt);const exA=Object.entries(ex).sort((a,b)=>b[1]-a[1]),exM=exA[0]?.[1]||1;
const fb=FL().map(f=>[f,sum(db.funds.filter(x=>x.fund==f))]),rec=sum(db.funds.filter(x=>x.fund==capN()&&x.amt>0)),goal=n(db.set.goal),
stock=stockMap();
const verdict=k.sales==0?'Wala pang benta ngayong buwan.':k.net>=0?`Kumita ng ${P(k.net)} ngayong buwan.`:`Lugi ng ${P(-k.net)} ngayong buwan — tingnan ang gastos sa ibaba.`;
return `<div class="row" style="margin-bottom:10px"><h2 style="flex:2">Dashboard</h2><label style="flex:1">Buwan ${mSel()}</label></div>
<div class="card"><b class="${k.net>=0?'pos':'neg'}" style="font-size:17px">${verdict}</b></div>
<div class="kpis"><div class="kpi"><span>Cash on hand</span><b>${P(cashBal)}</b></div><div class="kpi"><span>Benta (buwan)</span><b>${P(k.sales)}</b></div><div class="kpi"><span>Gross profit</span><b class="${k.gross>=0?'pos':'neg'}">${P(k.gross)}</b></div><div class="kpi"><span>Net profit</span><b class="${k.net>=0?'pos':'neg'}">${P(k.net)}</b></div><div class="kpi"><span>Utang natitira</span><b>${P(debt)}</b></div><div class="kpi"><span>Defect rate</span><b>${k.made?(k.bad/k.made*100).toFixed(1)+'%':'—'}</b></div></div>
<div class="card"><h3>Benta vs Gastos — huling 7 araw</h3><div class="cols">${dv.map(x=>`<div class="col"><div class="pair"><i title="Benta ${P(x.s)}" style="height:${x.s/mx*100}%;background:var(--ok)"></i><i title="Gastos ${P(x.x)}" style="height:${x.x/mx*100}%;background:var(--ac2)"></i></div><small>${x.d.slice(5)}</small></div>`).join('')}</div><div class="lg"><span><i style="background:var(--ok)"></i>Benta</span><span><i style="background:var(--ac2)"></i>Gastos</span></div></div>
<div class="card"><h3>Profit breakdown (${S.m})</h3>${bar('Benta',k.sales,k.sales,P,'var(--ok)')}${bar('Direct cost (Materyales + Labor)',k.direct,k.sales,P,'var(--warn)')}${bar('Operating expenses',k.op,k.sales,P,'var(--ac2)')}${bar('Net profit',Math.max(0,k.net),k.sales,P,'var(--ac)')}</div>
<div class="card"><h3>Gastos ayon sa category</h3>${exA.length?exA.map(([c,v])=>bar(c,v,exM)).join(''):'<p class="hint">Wala pang gastos ngayong buwan.</p>'}</div>
<div class="card"><h3>Capital recovery</h3>${goal>0?bar(`Nabawi ${P(rec)} ng ${P(goal)}`,rec,goal,v=>(v/goal*100).toFixed(0)+'%','var(--ok)'):'<p class="hint">I-set ang initial capital sa Settings para makita ang progress.</p>'}</div>
<div class="card"><h3>Pondo</h3>${fb.map(([f,v])=>bar(f,v,Math.max(1,...fb.map(x=>x[1])))).join('')}</div>

function stockBase(){const rows=[...db.inv].reverse().map(x=>[[x.d,esc(x.m),x.b+' '+x.u,x.g,x.w,(x.b-x.g-x.w)],x.id]),pr=[...db.prod].reverse().map(x=>[[x.d,esc(x.p||''),x.made,x.bad,x.sold,esc(x.note||'')],x.id]);

const GS="// IkoTela Sync - i-paste sa Google Sheet > Extensions > Apps Script\nconst KEY='PALITAN-MO-ITO'; // PALITAN ng sarili mong sikretong code (8+ characters, mahaba at random)\nfunction sh_(n){const b=SpreadsheetApp.getActiveSpreadsheet();return b.getSheetByName(n)||b.insertSheet(n)}\nfunction out_(o){return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON)}\nfunction bad_(k){if(KEY==='PALITAN-MO-ITO'||KEY.length<8)return out_({ok:false,err:'setup'});if(k!==KEY)return out_({ok:false,err:'key'});return null}\nfunction doGet(e){\n  const x=bad_(e&&e.parameter&&e.parameter.key);if(x)return x;\n  const l=LockService.getScriptLock();\n  try{l.waitLock(20000)}catch(err){return out_({ok:false,err:'busy'})}\n  try{\n    const v=sh_('IkoTela_Data').getDataRange().getValues();\n    return out_({ok:true,rev:+v[0][1]||0,data:v.slice(1).map(r=>r[0]).join('')});\n  }finally{l.releaseLock()}\n}\nfunction doPost(e){\n  const l=LockService.getScriptLock();\n  try{l.waitLock(20000)}catch(err){return out_({ok:false,conflict:true})}\n  try{\n    let b;try{b=JSON.parse(e.postData.contents)}catch(err){return out_({ok:false,err:'bad'})}\n    const x=bad_(b.key);if(x)return x;\n    if(typeof b.data!=='string')return out_({ok:false,err:'bad'});\n    const s=sh_('IkoTela_Data'),cur=+s.getRange('B1').getValue()||0;\n    if(b.rev!==cur)return out_({ok:false,conflict:true});\n    const rev=cur+1,rows=[['REV',rev,new Date().toISOString()]];\n    for(let i=0;i<b.data.length;i+=40000)rows.push([b.data.slice(i,i+40000),'','']);\n    s.clear();const r=s.getRange(1,1,rows.length,3);r.setNumberFormat('@');r.setValues(rows);\n    try{cash_(JSON.parse(b.data))}catch(err){console.error('cash_ '+err)} // hindi dapat masira ang sync kung pumalya ang Cashflow sheet\n    return out_({ok:true,rev:rev});\n  }finally{l.releaseLock()}\n}\nfunction cash_(db){\n  const s=sh_('Cashflow');s.clear();\n  const r=[['Petsa','Uri','Category','Halaga','Note']].concat((db.cash||[]).map(x=>[x.d,x.t,x.cat,x.amt,x.note||'']));\n  [1,3,5].forEach(c=>s.getRange(1,c,r.length,1).setNumberFormat('@'));\n  s.getRange(1,1,r.length,5).setValues(r);\n}\n",PK=K+'_pin',SK=K+'_sync';
const hashOf=r=>{const j=JSON.stringify(r,(a,v)=>a=='_u'||a=='lastBackup'||a=='lb'?undefined:v);let x=0;for(let i=0;i<j.length;i++)x=(x*31+j.charCodeAt(i))|0;return x};
function stamp(){const h=db._h=db._h||{},seen=new Set(['set']);TB.forEach(k=>db[k].forEach(r=>{seen.add(r.id);const x=hashOf(r);if(h[r.id]!==x){h[r.id]=x;r._u=Date.now()}}));
const x=hashOf(db.set);if(h.set===undefined)h.set=x;else if(h.set!==x){h.set=x;db.set._u=Date.now()}
Object.keys(h).forEach(i=>{if(!seen.has(i)){delete h[i];(db.dead=db.dead||[]).push(i)}});if(db.dead)db.dead=db.dead.slice(-3000)}
const _sv=save;save=function(){stamp();_sv();schedPush()};
function syncMerge(o){const dead=new Set([...(db.dead||[]),...(Array.isArray(o.dead)?o.dead:[])]);db.dead=[...dead].slice(-3000);if(db._h)dead.forEach(i=>delete db._h[i]);
TB.forEach(k=>{const m=new Map(db[k].map(r=>[r.id,r]));(Array.isArray(o[k])?o[k]:[]).forEach(r=>{if(!r||typeof r!='object')return;const l=m.get(r.id);if(!l||(r._u||0)>(l._u||0))m.set(r.id,r)});db[k]=[...m.values()].filter(r=>!dead.has(r.id))});
if(o.set&&typeof o.set=='object'&&(o.set._u||0)>(db.set._u||0)){const lb=db.set.lastBackup;db.set=o.set;db.set.lastBackup=lb}
db.seq=Math.max(n(db.seq),n(o.seq));migrate();recalc();db._h=db._h||{};TB.forEach(k=>db[k].forEach(r=>db._h[r.id]=hashOf(r)));db._h.set=hashOf(db.set)}
const syncCfg=()=>{try{return JSON.parse(localStorage.getItem(SK))||{}}catch(e){return{}}};
const setSy=t=>{S.sy=t;const e=$('sy_s');if(e)e.textContent=t};
let syBusy=0,syT;
function schedPush(){if(!syncCfg().url)return;clearTimeout(syT);syT=setTimeout(()=>syncNow(0),4000)}
async function syncNow(man){const c=syncCfg();if(!c.url||!c.key){if(man)toast('Ilagay muna ang URL at KEY.',1);return}if(syBusy)return;syBusy=1;setSy('Nagsa-sync...');
try{for(let t=0;t<3;t++){const g=await(await fetch(c.url+(c.url.includes('?')?'&':'?')+'action=pull&key='+encodeURIComponent(c.key)+'&t='+Date.now())).json();
if(!g.ok)throw new Error(g.err=='key'?'Mali ang KEY':g.err=='setup'?'Palitan muna ang KEY sa Apps Script (hindi puwede ang default)':g.err=='busy'?'Busy ang server, ulitin':'Error sa server');
if(g.data){const o=JSON.parse(g.data);if(!o||!Array.isArray(o.cash))throw new Error('Sira ang data sa sheet');syncMerge(o);_sv()}
stamp();const p=await(await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:c.key,rev:g.rev,data:JSON.stringify(db,(k,v)=>k=='_h'?undefined:v)})})).json();
if(p.ok){db.set.lastBackup=Date.now();_sv();setSy('Huling sync: '+new Date().toLocaleTimeString());if(!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&S.tab!='eod')render();if(man)toast('Na-sync!');return}
if(!p.conflict)throw new Error('Hindi na-save sa sheet')}
throw new Error('May nag-uunahang sync, ulitin')}catch(e){setSy('Sync error: '+e.message);if(man)toast('Sync error: '+e.message,1)}finally{syBusy=0}}
function syncSave(){const u=V('sy_u').trim(),k=V('sy_k').trim();if(!/^https:\/\/script\.google\.com\/(a\/macros\/[^\/]+\/|macros\/)s\/[\w-]+\/exec$/.test(u))return toast('Hindi tamang Apps Script URL (dapat nagtatapos sa /exec).',1);if(k==='PALITAN-MO-ITO'||k.length<8)return toast('Ang KEY ay dapat 8+ characters at hindi ang default.',1);localStorage.setItem(SK,JSON.stringify({url:u,key:k}));syncNow(1)}

function syncCard(){const c=syncCfg();return `<div class="card"><h3>☁️ Partner Sync / Google Sheet</h3><p class="hint">Isang Google Sheet ang gamit ng buong team: ito ang backup at ito rin ang sync. (1) Gumawa ng Google Sheet, Extensions → Apps Script. (2) I-paste ang code (button sa baba) at palitan ang KEY. (3) Deploy → New deployment → Web app → Execute as: Me, Who has access: Anyone → kopyahin ang URL. (4) I-paste ang URL at KEY dito, at sa device ng partner. Ang "Cashflow" tab sa sheet ay nababasa mo bilang listahan.</p><button class="btn alt" onclick="copyGS()">📋 Kopyahin ang Apps Script code</button><label>Web app URL<input id="sy_u" value="${esc(c.url||'')}" placeholder="https://script.google.com/macros/s/.../exec"></label><label>Sync code (KEY)<input id="sy_k" type="password" value="${esc(c.key||'')}"></label><div class="row"><button class="btn" onclick="syncSave()">I-save at i-sync</button><button class="btn alt" onclick="syncNow(1)">Sync ngayon</button><button class="btn alt" onclick="syncOff()">Idiskonekta</button></div><p class="hint" id="sy_s">${esc(S.sy||'')}</p><p class="hint">Awtomatiko ang sync pagbukas ng app at ilang segundo matapos ang bawat save. Kapag parehong in-edit ang isang record, ang mas bagong edit ang mananaig. Ang binura ay nabubura rin sa partner. Ang PIN at sync code ay hindi ipinapadala sa sheet. Ang may access sa sheet ay nakakabasa ng lahat ng data; huwag ibigay ang URL at KEY sa iba.</p></div>`}
/* PIN */
const pinGet=()=>{try{return JSON.parse(localStorage.getItem(PK))}catch(e){return null}};
async function pinHash(p,salt){const t=salt+':'+p;if(window.crypto&&crypto.subtle&&window.TextEncoder){const E=new TextEncoder(),k=await crypto.subtle.importKey('raw',E.encode(t),'PBKDF2',false,['deriveBits']),b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:E.encode(salt),iterations:100000,hash:'SHA-256'},k,256);return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}let h=5381;for(let i=0;i<t.length;i++)h=((h*33)^t.charCodeAt(i))>>>0;return'w'+h}
let lockAt=+localStorage.getItem(PK+'_t')||0,fails=0,lastAct=Date.now(),hid=0;
function lock(){if(!pinGet()||$('lock'))return;const d=document.createElement('div');d.id='lock';d.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px';
d.innerHTML='<h2>🔒 IkoTela</h2><input id="lk" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" style="max-width:220px;text-align:center;font-size:22px"><button class="btn" id="lkb" style="max-width:220px">I-unlock</button><p class="hint" id="lkm"></p><button class="x" id="lkf" style="font-size:12px">Nakalimutan ang PIN?</button>';document.body.appendChild(d);
$('lkb').onclick=unlock;$('lk').onkeydown=e=>{if(e.key=='Enter')unlock()};$('lkf').onclick=pinForgot;$('lk').focus()}
async function unlock(){const p=pinGet(),m=$('lkm');if(!p)return $('lock').remove();if(Date.now()<lockAt){m.textContent='Maghintay ng '+Math.ceil((lockAt-Date.now())/1e3)+'s.';return}
if(await pinHash($('lk').value,p.s)==p.h){fails=0;$('lock').remove();lastAct=Date.now();syncNow(0)}else{$('lk').value='';m.textContent='Maling PIN.';if(++fails>=3){lockAt=Date.now()+30000*Math.min(fails-2,10);localStorage.setItem(PK+'_t',lockAt);m.textContent+=' Maghintay ng '+Math.ceil((lockAt-Date.now())/1e3)+'s.'}}}
function pinForgot(){if(!confirm('Buburahin nito ang lahat ng data SA DEVICE NA ITO at ang PIN. Mababawi mo lang kung naka-set up ang Google Sheet sync o may backup ka. Tuloy?'))return;try{[K,PK,K+'_draft'].forEach(k=>localStorage.removeItem(k))}catch(e){}location.reload()}
async function pinSet(){const p=pinGet(),v=$('pn_n').value;if(p&&await pinHash($('pn_o').value,p.s)!=p.h)return toast('Mali ang kasalukuyang PIN.',1);if(!/^\d{4,8}$/.test(v))return toast('PIN: 4 hanggang 8 numero.',1);try{const s=uid();localStorage.setItem(PK,JSON.stringify({s,h:await pinHash(v,s)}));toast('Na-set ang PIN.');render()}catch(e){toast('Hindi na-save ang PIN.',1)}}
async function pinOff(){const p=pinGet();if(!p||await pinHash($('pn_o').value,p.s)!=p.h)return toast('Mali ang kasalukuyang PIN.',1);localStorage.removeItem(PK);toast('Inalis ang PIN.');render()}
function pinCard(){const p=pinGet();return `<div class="card"><h3>🔒 PIN lock</h3><p class="hint">Pantakip ito sa mata ng iba sa device na ito; hindi ito encryption ng data. ${p?'May PIN na.':'Wala pang PIN.'} Auto-lock pagkalipas ng 5 minutong walang galaw o 1 minutong nakatago ang app.</p>${p?'<label>Kasalukuyang PIN<input id="pn_o" type="password" inputmode="numeric" maxlength="8"></label>':''}<label>${p?'Bagong PIN':'PIN (4-8 numero)'}<input id="pn_n" type="password" inputmode="numeric" maxlength="8"></label><div class="row"><button class="btn" onclick="pinSet()">${p?'Baguhin':'I-set'}</button>${p?'<button class="btn alt" onclick="pinOff()">Alisin</button><button class="btn alt" onclick="lock()">I-lock ngayon</button>':''}</div></div>`}
